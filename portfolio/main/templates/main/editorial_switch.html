<div class="persona-switch {{ kind }}-switch"><span class="mono switch-label"><i></i>{{ site.alter_ego_label }}</span><div role="radiogroup" aria-label="{{ site.alter_ego_label }}">{% for key,p in personas.items %}{% if not forloop.first %}<span class="switch-slash" aria-hidden="true">/</span>{% endif %}<button type="button" role="radio" aria-checked="{% if key == persona %}true{% else %}false{% endif %}" tabindex="{% if key == persona %}0{% else %}-1{% endif %}" data-persona-choice="{{ key }}"><span>{{ p.label }}</span><span class="switch-fill" aria-hidden="true">{{ p.label }}</span></button>{% endfor %}</div>{% if kind == 'hero' %}<p class="mono">{{ site.switch_hint }}</p>{% endif %}</div>
