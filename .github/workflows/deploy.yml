name: Deploy to PythonAnywhere

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DEBUG is False
        run: |
          python - <<'EOF'
          import sys, os, django
          sys.path.insert(0, 'portfolio')
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'portfolio.settings')
          django.setup()
          from django.conf import settings
          assert not settings.DEBUG, 'ERROR: DEBUG must be False in production!'
          print('DEBUG is False — safe to deploy.')
          EOF
        env:
          DJANGO_SETTINGS_MODULE: portfolio.settings

      - name: Run regression tests
        run: python portfolio/manage.py test main --verbosity=2

      - name: Check for missing migrations
        run: python portfolio/manage.py makemigrations --check --dry-run

      - name: Check production settings
        run: python portfolio/manage.py check --deploy --fail-level WARNING

      - name: Run collectstatic
        run: python portfolio/manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: portfolio.settings

      - name: Trigger deploy via /update-website/
        run: |
          curl -s --fail --retry 3 --retry-delay 5 \
            "https://myportfolioshahzan.pythonanywhere.com/update-website/" \
            | tee /dev/stderr \
            | grep -q "Return code: 0"
