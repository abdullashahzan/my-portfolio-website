name: Deploy to PythonAnywhere

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DEBUG is False
        run: |
          python - <<'EOF'
          import sys, os, django
          sys.path.insert(0, 'portfolio')
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'portfolio.settings')
          django.setup()
          from django.conf import settings
          assert not settings.DEBUG, 'ERROR: DEBUG must be False in production!'
          print('DEBUG is False — safe to deploy.')
          EOF
        env:
          DJANGO_SETTINGS_MODULE: portfolio.settings

      - name: Run collectstatic
        run: python portfolio/manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: portfolio.settings

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create PythonAnywhere console
        id: create_console
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://www.pythonanywhere.com/api/v0/user/${{ secrets.PYTHONANYWHERE_USERNAME }}/consoles/" \
            -H "Authorization: Token ${{ secrets.PYTHONANYWHERE_API_TOKEN }}" \
            -d "executable=bash")

          echo "$RESPONSE"

          CONSOLE_ID=$(echo "$RESPONSE" | jq -r '.id')

          echo "CONSOLE_ID=$CONSOLE_ID" >> $GITHUB_ENV

      - name: Run deploy script
        run: |
          curl -X POST \
            "https://www.pythonanywhere.com/api/v0/user/${{ secrets.PYTHONANYWHERE_USERNAME }}/consoles/${{ env.CONSOLE_ID }}/send_input/" \
            -H "Authorization: Token ${{ secrets.PYTHONANYWHERE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"input\":\"bash /home/${{ secrets.PYTHONANYWHERE_USERNAME }}/deploy.sh\n\"}"
